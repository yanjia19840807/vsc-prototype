# 字段含义和示例见 vessel-schedules-api.md。
openapi: 3.0.3
info:
  title: 船期平台
  version: 0.1.0
  description: |
    页面对外的读写。JSON 用页面字段名，不返回库列名。响应里只有 id，不返回 URL。
    表结构见 vessel-schedules-api.md。lara_sync_run、lara_payload、terminal_sync_run、terminal_query、terminal_payload 不在这份规范里。保留上一版还是采用这次同步留在页面上，确认时只写入最终的码头值和匹配状态。

    后端管筛选、排序、分页、匹配状态、待确认差异、同步落库、保存、活动日志。后端不按某个人的列表方案裁剪结果。
    列表方案、列标题、空值占位、时间格式、按钮、提示文案、高亮由前端处理。相对日期先折成绝对日期再提交。导出由服务端按当前筛选条件生成 Excel，包含过滤后的全部船期。
    接口不返回能否点 Review、输入框是否可编、候选条数文案、系统同步的说明句子，也不返回 Visit no、cutoff、合作方、同步运行记录。

    用户在列表方案里勾选的字段和天数阈值，只决定这个用户看到哪些已经写入的差异。不决定能不能自动写入，也不决定是否进入审核。LARA 与上一版不同就写入差异，不要求已经绑上码头。人工确认后留下的码头值，与上一版不同且被该用户关注时，同样写入差异。天数阈值只过滤日期。pending 为 false 的差异用于高亮。审核页上该字段已经展开上一版和这次同步时，不再另放提示图标。

    当前不是 Manual matched、也不是 Pending match 时，同步写入全部最新字段并写入 platformMatchingStatus，changes.pending 为 false。
    正好一条码头记录、进出口航次都有，并且 LARA ETA 与码头 ETA 相差不超过 3 天，结果是 Auto matched。
    缺航次是 No external voyage，天数差算不出来或超过 3 天是 ETA gap > 3 days，多条是 Multiple terminal records，没有记录是 No terminal record。

    当前是 Manual matched 或 Pending match 时，不自动覆盖已保存的码头字段。LARA 每次成功同步都写入最新值，页面始终显示最新 LARA。已保存的码头字段与这次同步有差异，或这次不再是一条已确认绑定，platformMatchingStatus 写成 Pending match，相关码头差异 pending 为 true。确认前列表和明细的码头格子显示 —，审核页仍显示已保存的值。确认必须选择或新建一条码头记录，结果为 Manual matched。已保存的每个码头字段都和这次同步相同、绑定仍是这一条时，platformMatchingStatus 保持 Manual matched。
    terminal_source 为 USER 时，下一次码头同步没有记录则忽略这次结果：码头列和 platformMatchingStatus 保持原值，platformTerminalPending 为 null，不进入审核。

    Manual matched 或 Pending match 之后下一次仍是多条时，出口航次和进口航次都有值且只有一条候选两个都相同，该条只是比对对象。platformTerminalPending 仍为 many。改选只换比对对象，不整条覆盖已保存的码头记录。确认当前记录时保留已保存的值。

    审核确认必须选择或新建一条码头记录，platformMatchingStatus 为 Manual matched。没有码头记录时返回 409，不写入。缺航次或 ETA 相差超过 3 天不阻止确认。
    已挂到正式航次上的手工临时船不进入这些接口。手工船的新建、修改、删除，以及临时船关联，不在这里。
servers:
  - url: /
tags:
  - name: vessel-schedules
    description: 船期搜索、列表、明细
  - name: review
    description: 审核、码头候选、单笔同步
  - name: activity-logs
    description: 活动日志
  - name: terminal-voyages
    description: 已入库的码头航次
  - name: coverage
    description: 区域、港口、码头代码
paths:
  /v1/vessel-schedules:
    get:
      tags: [vessel-schedules]
      operationId: queryVesselSchedules
      summary: 查询船期
      description: |
        筛选、排序和分页都是查询参数，直接用字段名。不带筛选参数时不附加筛选。默认排序 -laraEtb。
        多选和多行重复同一个字段名。子串参数只出现一次。日期用字段名加 From、To，例如 laraEtbFrom、laraEtbTo。
        列表在没有绑定、platformMatchingStatus 为 Multiple terminal records 或 ETA gap > 3 days、或港口未覆盖且不是手工补录时，terminal 字段为 null。
        changes 没有差异时为 null。pending 为 true 时当前值是 previousValue；pending 为 false 时当前值是 incomingValue。
      parameters:
        - $ref: "#/components/parameters/scheduleSort"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: 船期页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/vessel-schedules/export:
    get:
      tags: [vessel-schedules]
      operationId: exportVesselSchedules
      summary: 导出船期
      description: |
        服务端生成 Excel。筛选参数和 sort 与查询船期相同，不带 page、pageSize。数据范围是本次条件命中的全部船期。
        工作表一行一条船期。列表上 terminal 字段为 null 的格子在表里留空。不包含 lara_visit_no。时刻写成 YYYY-MM-DD HH:mm。
      parameters:
        - $ref: "#/components/parameters/scheduleSort"
      responses:
        "200":
          description: Excel 文件。
          headers:
            Content-Disposition:
              description: 附件文件名，例如 attachment; filename="vessel-schedules.xlsx"。
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/vessel-schedules/{scheduleId}:
    get:
      tags: [vessel-schedules]
      operationId: getVesselSchedule
      summary: 读取船期明细
      description: |
        在列表行之外增加 sources。列表不返回这项。明细不改数据。用户备注在活动日志里。
        标题用 laraPointCode、laraVoyage、platformMatchingStatus、platformCandidateCount、platformSharedLaraCount、platformVoyageStatus。
        terminalManual 为 true 时，前端在码头区标题标明手工录入。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      responses:
        "200":
          description: 船期明细
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vessel-schedules/{scheduleId}/review:
    get:
      tags: [review]
      operationId: getVesselScheduleReview
      summary: 读取审核
      description: |
        返回标题、当前 LARA 字段、当前绑定的码头字段、待确认差异。不返回候选表，也不返回 platformLastModifiedBy。
        用户备注不在这个响应里。页面上的备注框从空开始，确认时写入活动日志。
        码头字段尚未绑定时为 null。已绑定则带上全部码头字段，包括列表里被藏起来的值。
        前端按这些值决定表单：No terminal record 必须新建一条码头记录后才能确认；No external voyage 只能改 terminalExportVoyage 和 terminalImportVoyage；Manual matched 且 terminalManual 可改。删除当前手工记录后，必须再选择或新建一条才能确认。其余状态码头字段只读。确认必须带上一条码头记录。
        pending 为 true 的字段只在 previousValue 和 incomingValue 之间选。LARA 字段不能手输。
        platformTerminalPending 为 many 时展示状态变化和选择按钮。none 先处理没有码头记录。取消编辑不请求接口。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      responses:
        "200":
          description: 审核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [review]
      operationId: saveVesselScheduleReview
      summary: 保存审核
      description: |
        没有变化返回 400。没有选择或新建一条码头记录时返回 409，不写入。platformMatchingStatus 由服务端写入。同步按匹配规则计算。审核确认绑上一条码头记录时写成 Manual matched。请求不带这个字段，带了也忽略。码头字段不能全部为 null。已有码头记录且请求不带码头字段时，码头列保持不变。每种成功都写一条活动日志。
        fields 是这次要写入的码头字段最终值。没出现的字段保持船期上已保存的值。LARA 和 platformMatchingStatus 不在 fields 里。
        laraVesselType、laraTerminal、platformMatchingStatus 提交了也忽略。确认当前记录时不带 candidateId 和码头字段。改选另一条时带 candidateId 和该条码头字段。码头字段单独出现时，表示修改当前绑定或新建手工记录。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSave"
      responses:
        "200":
          description: 保存后的审核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: 无变化，或字段取值不在允许范围内。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 没有选择或新建一条码头记录。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/vessel-schedules/{scheduleId}/terminal-candidates:
    get:
      tags: [review]
      operationId: listTerminalCandidates
      summary: 读取码头候选
      description: |
        打开选择框时读取。没有候选时 data 为空数组。
        尚未绑定且状态是 Multiple terminal records 时，选中的 id 留在页面上，跟确认一起提交。
        platformTerminalPending 为 many 时，选中一条后只更换比对对象。能按航次唯一对上时，current 为 true 的是默认记录。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      responses:
        "200":
          description: 候选列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalCandidateList"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vessel-schedules/{scheduleId}/lara-sync:
    post:
      tags: [review]
      operationId: syncLara
      summary: 单笔同步 LARA
      description: 审核页的 Sync latest。页面先丢掉未保存编辑再发起。没有请求正文。成功后返回审核，不返回运行记录。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      responses:
        "200":
          description: 同步后的审核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/vessel-schedules/{scheduleId}/terminal-sync:
    post:
      tags: [review]
      operationId: syncTerminal
      summary: 单笔同步码头
      description: |
        查询使用船期上当时的英文船名和 Point code，对应报文里的 vesselNameEn 和 portCode。这页不能临时改这两个条件。
        港口未覆盖时返回 409。没有请求正文。成功后返回审核，不返回运行记录。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
      responses:
        "200":
          description: 同步后的审核
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 港口没有码头覆盖。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/vessel-schedules/{scheduleId}/activity-logs:
    get:
      tags: [activity-logs]
      operationId: listActivityLogs
      summary: 查询活动日志
      description: |
        一次保存或一次自动落库产生一条日志。changes 是这一次的原值和新值，展开明细用这个数组。
        人工确认的 remark 是用户写下的备注。用户留空时，前端按 changes 的 field 和 match 生成说明。系统落库时 remark 由服务端写成这次事件，例如系统同步 LARA、系统同步码头、系统自动建立匹配，前端直接显示。
        从某一列进入时，前端把列换成 field，不提交列标题。
      parameters:
        - $ref: "#/components/parameters/scheduleId"
        - name: field
          in: query
          description: 字段名子串，忽略大小写。
          schema:
            type: string
        - name: triggeredBy
          in: query
          description: 操作人子串，忽略大小写。
          schema:
            type: string
        - name: from
          in: query
          description: 日期，包含这一天。
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 日期，包含这一天。
          schema:
            type: string
            format: date
        - name: sort
          in: query
          description: 默认 -triggeredAt。还可以排 triggeredBy、remark。减号表示降序。
          schema:
            type: string
            default: "-triggeredAt"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: 活动日志页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogPage"
        "400":
          description: 排序或分页非法。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/terminal-voyages:
    get:
      tags: [terminal-voyages]
      operationId: queryTerminalVoyages
      summary: 查询码头航次
      description: |
        筛选、排序和分页都是查询参数。不带筛选参数时不附加筛选。
        vesselName、voyage、region、portCode、status 可重复。日期用 etaFrom、etaTo 这种名字。
        读取 terminal_payload。一条船期最近一次成功查询为 FOUND 时，这次的候选进入列表。NOT_FOUND 时该船期没有候选。FAILED 时仍是上一次成功查询的候选。portCode 取 terminal_query.port_code。同一 port_code、vessel_name_en、evoyage、ivoyage 只返回一行，id 是其中一条 terminal_payload.id。默认排序 -eta。
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            default: "-eta"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: 码头航次页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalVoyagePage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /v1/terminal-voyages/{voyageId}:
    get:
      tags: [terminal-voyages]
      operationId: getTerminalVoyage
      summary: 读取一条码头航次
      description: voyageId 是 terminal_payload.id。值为 null 的字段仍然返回。字段标题和时间格式由前端处理。
      parameters:
        - name: voyageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 码头航次
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalVoyage"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/regions:
    get:
      tags: [coverage]
      operationId: listRegions
      summary: 查询区域
      responses:
        "200":
          description: 区域列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionList"

  /v1/regions/{code}:
    put:
      tags: [coverage]
      operationId: saveRegion
      summary: 保存区域
      description: code 已存在则更新，否则新建。active 为 false 的区域不能再选给新港口，已有港口仍保留原代码。
      parameters:
        - $ref: "#/components/parameters/regionCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Region"
            example:
              code: CC
              name: China domestic
              active: true
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "201":
          description: 已新建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "400":
          description: 路径中的 code 与正文不一致。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [coverage]
      operationId: setRegionActive
      summary: 停用或启用区域
      parameters:
        - $ref: "#/components/parameters/regionCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveChange"
      responses:
        "200":
          description: 更新后的区域
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Region"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [coverage]
      operationId: deleteRegion
      summary: 删除区域
      description: 已被港口使用时返回 409。
      parameters:
        - $ref: "#/components/parameters/regionCode"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 区域仍被港口使用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /v1/ports:
    get:
      tags: [coverage]
      operationId: listPorts
      summary: 查询港口
      description: |
        portCode、portName 是子串，忽略大小写。region 多选，精确匹配区域代码。coverage 为空表示全部。
        platformPointCovered 就是 apiCovered。码头查询只发给 active 和 apiCovered 都为 true 的港口。
      parameters:
        - name: portCode
          in: query
          schema:
            type: string
        - name: portName
          in: query
          schema:
            type: string
        - name: region
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: coverage
          in: query
          schema:
            type: string
            enum: [covered, not-covered]
      responses:
        "200":
          description: 港口列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortList"

  /v1/ports/{portCode}:
    put:
      tags: [coverage]
      operationId: savePort
      summary: 保存港口
      description: |
        portCode 已存在则更新，否则新建。terminals 整组替换该港的代码。一个 9 位码可以挂多个 code。
        code 是报文里的 terminal，也是矩阵缩写。停用区域不能选作 regionCode。
        正文不带 active，已有港口保持原来的 active。
      parameters:
        - $ref: "#/components/parameters/portCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortWrite"
            example:
              portCode: CNNGB
              portName: NINGBO
              regionCode: CC
              apiCovered: true
              terminals:
                - nineCode: CNNGBYAN
                  code: YS01
                  nameZh: 大榭招商
                - nineCode: CNNGBYAN
                  code: YAN1
                  nameZh: 大榭招商
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Port"
        "201":
          description: 已新建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Port"
        "400":
          description: 路径与正文的 portCode 不一致，或 regionCode 已停用、不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 码头代码或 9 位码和其他港口冲突。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    patch:
      tags: [coverage]
      operationId: setPortActive
      summary: 停用或启用港口
      description: 只改 active。停用后历史船期仍显示原 Point code，新建筛选不能再选，也不再发码头查询。
      parameters:
        - $ref: "#/components/parameters/portCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveChange"
      responses:
        "200":
          description: 更新后的港口
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Port"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [coverage]
      operationId: deletePort
      summary: 删除港口
      description: 已被船期引用时返回 409，可以改为停用。
      parameters:
        - $ref: "#/components/parameters/portCode"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 港口已被船期引用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  parameters:
    scheduleId:
      name: scheduleId
      in: path
      required: true
      schema:
        type: string
    portCode:
      name: portCode
      in: path
      required: true
      schema:
        type: string
    regionCode:
      name: code
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    scheduleSort:
      name: sort
      in: query
      description: 字段名，减号表示降序，例如 -laraEtb,terminalEtd。默认 -laraEtb。
      schema:
        type: string
        default: "-laraEtb"

  responses:
    BadRequest:
      description: 字段未知、日期非法，或取值不在允许范围内。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: 资源不存在。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: RFC 7807。Content-Type 为 application/problem+json。
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    Page:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    MatchingStatus:
      type: string
      description: |
        保存在船期上，请求里不带。同步和审核写入时更新。
        空值只出现在还没写过状态的新船期。审核确认必须选择或新建一条码头记录，结果是 Manual matched。已保存的码头值与后来的同步相同、绑定也仍是这一条时保持 Manual matched，不覆盖码头字段。LARA 始终写入最新值。已是 Manual matched 或 Pending match，且已保存的码头字段或绑定结果与这次同步不同时，matching_status 写成 Pending match。terminal_source 为 USER 且这次码头同步没有记录时，matching_status 保持原值。No terminal record 只由没有记录的同步写入，不能由审核确认写入。
        尚未审核时：正好一条、进出口航次都有、LARA ETA 与码头 ETA 相差不超过 3 天为 Auto matched。没有绑定且仍有候选为 Multiple terminal records，没有候选为 No terminal record，绑着的记录缺少进口或出口航次为 No external voyage，天数差算不出来或超过 3 天为 ETA gap > 3 days。
      enum:
        - Auto matched
        - Manual matched
        - Pending match
        - Multiple terminal records
        - ETA gap > 3 days
        - No external voyage
        - No terminal record

    VoyageStatus:
      type: string
      description: Active 或 Omit。后续批量里不再出现的船期也是 Omit，对应 platform_omit。
      enum: [Active, Omit]

    TerminalPending:
      type: string
      nullable: true
      description: |
        只在 Manual matched 或 Pending match，且最近一次码头同步不再是一条时有值。many 表示仍有多条候选。none 表示没有记录。terminal_source 为 USER 且这次没有记录时为 null。其余为 null。
      enum: [many, none]

    DateTime:
      type: string
      format: date-time
      nullable: true

    Scalar:
      type: string
      nullable: true
      description: 业务值。时刻用 ISO-8601。空为 null。

    Lara:
      type: object
      description: |
        船期行上的 LARA 字段。laraVesselOperator 来自 OPERATOR_CODE。laraBrand、laraVesselType、laraTerminal 由服务端计算，提交了也忽略。
        laraTerminal 按 laraPointCode 和码头代码从港口覆盖连接。
      required: [laraVoyage, laraPointCode, laraPoolLocation, laraVesselName, laraVesselOperator, laraBrand, laraService, laraEta, laraEtb, laraEtd, laraVesselType, laraTerminal]
      properties:
        laraVoyage:
          type: string
        laraPointCode:
          type: string
        laraPoolLocation:
          type: string
          nullable: true
        laraVesselName:
          type: string
        laraVesselOperator:
          type: string
          nullable: true
        laraBrand:
          type: string
          nullable: true
        laraService:
          type: string
          nullable: true
        laraEta:
          $ref: "#/components/schemas/DateTime"
        laraEtb:
          $ref: "#/components/schemas/DateTime"
        laraEtd:
          $ref: "#/components/schemas/DateTime"
        laraVesselType:
          type: string
          nullable: true
        laraTerminal:
          type: string
          nullable: true
          description: Terminal 9code。列表上格子不展示时为 null。

    TerminalRecord:
      type: object
      description: 船期行上的码头字段。没有绑定时这些字段为 null。terminalManual 为 true 表示手工补录。
      required: [terminalManual, terminalExportVoyage, terminalImportVoyage, terminalVesselNameCn, terminalName, terminalEta, terminalAta, terminalEtb, terminalAtb, terminalEtd, terminalAtd, terminalCyOpen, terminalCyCutoff, terminalVesselStatus, terminalUpdateTime]
      properties:
        terminalManual:
          type: boolean
          nullable: true
        terminalExportVoyage:
          type: string
          nullable: true
        terminalImportVoyage:
          type: string
          nullable: true
        terminalVesselNameCn:
          type: string
          nullable: true
        terminalName:
          type: string
          nullable: true
          description: 报文 terminal，例如 YS01。
        terminalEta:
          $ref: "#/components/schemas/DateTime"
        terminalAta:
          $ref: "#/components/schemas/DateTime"
        terminalEtb:
          $ref: "#/components/schemas/DateTime"
        terminalAtb:
          $ref: "#/components/schemas/DateTime"
        terminalEtd:
          $ref: "#/components/schemas/DateTime"
        terminalAtd:
          $ref: "#/components/schemas/DateTime"
        terminalCyOpen:
          $ref: "#/components/schemas/DateTime"
        terminalCyCutoff:
          $ref: "#/components/schemas/DateTime"
        terminalVesselStatus:
          type: string
          nullable: true
          description: 报文 status，例如计划、在港、离港。不是匹配状态。
        terminalUpdateTime:
          $ref: "#/components/schemas/DateTime"

    TerminalInput:
      type: object
      description: 保存审核时可选的码头字段。已有码头记录且不带这些字段表示码头列保持不变。不能全部为 null。不含 terminalManual。
      properties:
        terminalExportVoyage:
          type: string
          nullable: true
        terminalImportVoyage:
          type: string
          nullable: true
        terminalVesselNameCn:
          type: string
          nullable: true
        terminalName:
          type: string
          nullable: true
        terminalEta:
          $ref: "#/components/schemas/DateTime"
        terminalAta:
          $ref: "#/components/schemas/DateTime"
        terminalEtb:
          $ref: "#/components/schemas/DateTime"
        terminalAtb:
          $ref: "#/components/schemas/DateTime"
        terminalEtd:
          $ref: "#/components/schemas/DateTime"
        terminalAtd:
          $ref: "#/components/schemas/DateTime"
        terminalCyOpen:
          $ref: "#/components/schemas/DateTime"
        terminalCyCutoff:
          $ref: "#/components/schemas/DateTime"
        terminalVesselStatus:
          type: string
          nullable: true
        terminalUpdateTime:
          $ref: "#/components/schemas/DateTime"

    FieldDiff:
      type: object
      description: |
        当前值与最新值的一个字段。没有更早的历史。没有差异时，外层 changes 为 null，不返回空数组。
        pending 为 true 表示仍要人确认，页面显示 previousValue。pending 为 false 表示已经写入，页面显示 incomingValue，只作提示。
      required: [field, previousValue, incomingValue, pending]
      properties:
        field:
          type: string
          description: 船期字段名，例如 laraEtb、terminalEtd、platformMatchingStatus。
        previousValue:
          $ref: "#/components/schemas/Scalar"
        incomingValue:
          $ref: "#/components/schemas/Scalar"
        pending:
          type: boolean

    FieldSource:
      type: object
      description: 手工改过的字段在改之前的来源值。只包含页面会标出来源的项。
      required: [field, value]
      properties:
        field:
          type: string
          description: 船期字段名，例如 terminalEtd。
        value:
          $ref: "#/components/schemas/Scalar"

    ScheduleRow:
      allOf:
        - $ref: "#/components/schemas/Lara"
        - $ref: "#/components/schemas/TerminalRecord"
        - type: object
          required: [id, platformVoyageStatus, platformPointCovered, platformMatchingStatus, platformCandidateCount, platformSharedLaraCount, platformTerminalPending, platformLastModifiedBy, platformLastModifiedAt, changes]
          properties:
            id:
              type: string
            platformVoyageStatus:
              $ref: "#/components/schemas/VoyageStatus"
            platformPointCovered:
              type: boolean
              description: 这个 Point code 是否对接码头接口，对应 port.api_covered。
            platformMatchingStatus:
              $ref: "#/components/schemas/MatchingStatus"
            platformCandidateCount:
              type: integer
              minimum: 0
              description: 当前待选码头记录的条数，没有则为 0。
            platformSharedLaraCount:
              type: integer
              minimum: 1
              description: 共用同一港口、码头和出口航次的船期条数，只有一条时为 1。
            platformTerminalPending:
              $ref: "#/components/schemas/TerminalPending"
            platformLastModifiedBy:
              type: string
              description: 实际操作者，包括 System。来自最新活动日志。
            platformLastModifiedAt:
              type: string
              format: date-time
            changes:
              type: array
              nullable: true
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldDiff"

    SchedulePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleRow"
        page:
          $ref: "#/components/schemas/Page"

    ScheduleDetail:
      allOf:
        - $ref: "#/components/schemas/ScheduleRow"
        - type: object
          required: [sources]
          properties:
            sources:
              type: array
              nullable: true
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldSource"

    Review:
      allOf:
        - $ref: "#/components/schemas/Lara"
        - $ref: "#/components/schemas/TerminalRecord"
        - type: object
          required: [id, platformVoyageStatus, platformPointCovered, platformMatchingStatus, platformCandidateCount, platformSharedLaraCount, platformTerminalPending, changes]
          properties:
            id:
              type: string
            platformVoyageStatus:
              $ref: "#/components/schemas/VoyageStatus"
            platformPointCovered:
              type: boolean
            platformMatchingStatus:
              $ref: "#/components/schemas/MatchingStatus"
            platformCandidateCount:
              type: integer
              minimum: 0
            platformSharedLaraCount:
              type: integer
              minimum: 1
            platformTerminalPending:
              $ref: "#/components/schemas/TerminalPending"
            changes:
              type: array
              nullable: true
              minItems: 1
              items:
                $ref: "#/components/schemas/FieldDiff"

    ScheduleFilter:
      type: object
      required: [field]
      description: |
        查询参数直接用字段名。这里描述列表方案里保存的一个筛选项。
        values、value、from/to 三选一。
        values：多选精确匹配，或船名、航次的多行精确匹配。多行字段为 laraVesselName、laraVoyage、terminalVesselNameCn、terminalExportVoyage、terminalImportVoyage，忽略大小写。代码类多选区分大小写。
        value：单行文本，子串匹配，忽略大小写。用于 laraPoolLocation、laraService、laraVesselOperator、platformLastModifiedBy。
        from、to：日期，包含两端，可只给一端。
        可筛选字段与列表列一致，另加 platformRegion。platformMatchingStatus、laraVesselType、laraBrand、laraPointCode、laraTerminal、terminalName、terminalVesselStatus 用 values。
      properties:
        field:
          type: string
          description: 船期字段名，例如 laraEtb、platformRegion。
        values:
          type: array
          minItems: 1
          items:
            type: string
        value:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
      additionalProperties: false

    ScheduleQuery:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleFilter"
        sort:
          type: string
          default: "-laraEtb"
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      additionalProperties: false

    ScheduleExport:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleFilter"
        sort:
          type: string
          default: "-laraEtb"
      additionalProperties: false

    ConfirmedField:
      type: object
      required: [field, value]
      properties:
        field:
          type: string
          description: 船期字段名。
        value:
          $ref: "#/components/schemas/Scalar"
      additionalProperties: false

    ReviewSave:
      allOf:
        - $ref: "#/components/schemas/TerminalInput"
        - type: object
          required: [remark, fields]
          properties:
            remark:
              type: string
              description: 这次保存的备注，只写入活动日志。可以是空字符串。
            fields:
              type: array
              items:
                $ref: "#/components/schemas/ConfirmedField"
            candidateId:
              type: string
              description: 改选另一条码头候选时带上 terminal_payload.id。确认当前绑定时省略。

    TerminalCandidate:
      type: object
      required: [id, current, terminalExportVoyage, terminalImportVoyage, terminalVesselNameCn, terminalName, terminalEta, terminalAta, terminalEtb, terminalAtb, terminalEtd, terminalAtd, terminalCyOpen, terminalCyCutoff, terminalVesselStatus, terminalUpdateTime]
      properties:
        id:
          type: string
          description: terminal_payload.id。
        current:
          type: boolean
          description: 这条就是现在用于比对或绑定的记录。选择框用它标出 Current。
        terminalExportVoyage:
          type: string
          nullable: true
        terminalImportVoyage:
          type: string
          nullable: true
        terminalVesselNameCn:
          type: string
          nullable: true
        terminalName:
          type: string
          nullable: true
        terminalEta:
          $ref: "#/components/schemas/DateTime"
        terminalAta:
          $ref: "#/components/schemas/DateTime"
        terminalEtb:
          $ref: "#/components/schemas/DateTime"
        terminalAtb:
          $ref: "#/components/schemas/DateTime"
        terminalEtd:
          $ref: "#/components/schemas/DateTime"
        terminalAtd:
          $ref: "#/components/schemas/DateTime"
        terminalCyOpen:
          $ref: "#/components/schemas/DateTime"
        terminalCyCutoff:
          $ref: "#/components/schemas/DateTime"
        terminalVesselStatus:
          type: string
          nullable: true
        terminalUpdateTime:
          $ref: "#/components/schemas/DateTime"

    TerminalCandidateList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TerminalCandidate"

    ActivityLogChange:
      type: object
      required: [field, original, updated]
      properties:
        field:
          type: string
          description: 船期字段名，例如 laraEtb、terminalEtd、platformMatchingStatus。
        original:
          $ref: "#/components/schemas/Scalar"
        updated:
          $ref: "#/components/schemas/Scalar"

    ActivityMatch:
      type: string
      nullable: true
      description: null 表示没有改变码头绑定。confirm 建立起绑定。switch 从已绑定的一条改到另一条。cancel 取消绑定。
      enum: [confirm, switch, cancel]

    ActivityLog:
      type: object
      required: [id, triggeredAt, triggeredBy, remark, match, changes]
      properties:
        id:
          type: string
        triggeredAt:
          type: string
          format: date-time
        triggeredBy:
          type: string
        remark:
          type: string
        match:
          $ref: "#/components/schemas/ActivityMatch"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLogChange"

    ActivityLogSchedule:
      type: object
      required: [id, vesselName, pointCode, voyage]
      properties:
        id:
          type: string
        vesselName:
          type: string
        pointCode:
          type: string
        voyage:
          type: string

    ActivityLogPage:
      type: object
      required: [schedule, data, page]
      properties:
        schedule:
          $ref: "#/components/schemas/ActivityLogSchedule"
        data:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLog"
        page:
          $ref: "#/components/schemas/Page"

    TerminalVoyageFilter:
      type: object
      required: [field]
      description: |
        vesselName：多行精确，忽略大小写，匹配 vesselNameEn 或 vesselNameCn。
        voyage：多行精确，忽略大小写，匹配 evoyage 或 ivoyage。
        region、portCode、status：多选精确匹配。
        eta、ata、etb、atb、etd、atd：日期，包含两端，可只给一端。
      properties:
        field:
          type: string
          enum: [vesselName, voyage, region, portCode, status, eta, ata, etb, atb, etd, atd]
        values:
          type: array
          minItems: 1
          items:
            type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
      additionalProperties: false

    TerminalVoyageQuery:
      type: object
      required: [filters]
      properties:
        filters:
          type: array
          items:
            $ref: "#/components/schemas/TerminalVoyageFilter"
        sort:
          type: string
          default: "-eta"
        page:
          type: integer
          minimum: 1
          default: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
      additionalProperties: false

    SourceTimestamp:
      type: string
      nullable: true
      description: 报文时刻原文，例如 2025-06-13 17:00:00。

    TerminalVoyage:
      type: object
      required: [id, status, vesselNameEn, vesselNameCn, shipCode, shipName, agentCode, agentName, lineCode, terminal, portsEn, portsCn, eta, ata, etb, atb, etd, atd, cyOpen, cyClosing, portCloseDate, customsCloseDate, updateTime, ivoyage, evoyage]
      properties:
        id:
          type: string
          description: terminal_payload.id。同一港口、英文船名、出口航次和进口航次有多条时，取其中一条。
        status:
          type: string
          nullable: true
        vesselNameEn:
          type: string
          nullable: true
        vesselNameCn:
          type: string
          nullable: true
        shipCode:
          type: string
          nullable: true
        shipName:
          type: string
          nullable: true
        agentCode:
          type: string
          nullable: true
        agentName:
          type: string
          nullable: true
        lineCode:
          type: string
          nullable: true
        terminal:
          type: string
          nullable: true
        portsEn:
          type: string
          nullable: true
        portsCn:
          type: string
          nullable: true
        eta:
          $ref: "#/components/schemas/SourceTimestamp"
        ata:
          $ref: "#/components/schemas/SourceTimestamp"
        etb:
          $ref: "#/components/schemas/SourceTimestamp"
        atb:
          $ref: "#/components/schemas/SourceTimestamp"
        etd:
          $ref: "#/components/schemas/SourceTimestamp"
        atd:
          $ref: "#/components/schemas/SourceTimestamp"
        cyOpen:
          $ref: "#/components/schemas/SourceTimestamp"
        cyClosing:
          $ref: "#/components/schemas/SourceTimestamp"
        portCloseDate:
          $ref: "#/components/schemas/SourceTimestamp"
        customsCloseDate:
          $ref: "#/components/schemas/SourceTimestamp"
        updateTime:
          $ref: "#/components/schemas/SourceTimestamp"
        ivoyage:
          type: string
          nullable: true
        evoyage:
          type: string
          nullable: true

    TerminalVoyagePage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TerminalVoyage"
        page:
          $ref: "#/components/schemas/Page"

    Region:
      type: object
      required: [code, name, active]
      properties:
        code:
          type: string
        name:
          type: string
        active:
          type: boolean
          description: true 时新建港口可以选。false 时停用，已经挂在港口上的代码仍显示。
      additionalProperties: false

    RegionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Region"

    PortTerminal:
      type: object
      required: [nineCode, code, nameZh]
      properties:
        nineCode:
          type: string
        code:
          type: string
        nameZh:
          type: string
          nullable: true
      additionalProperties: false

    Port:
      type: object
      required: [portCode, portName, regionCode, active, apiCovered, terminals]
      properties:
        portCode:
          type: string
        portName:
          type: string
        regionCode:
          type: string
        active:
          type: boolean
        apiCovered:
          type: boolean
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/PortTerminal"

    PortWrite:
      type: object
      required: [portCode, portName, regionCode, apiCovered, terminals]
      properties:
        portCode:
          type: string
        portName:
          type: string
        regionCode:
          type: string
        apiCovered:
          type: boolean
        terminals:
          type: array
          items:
            $ref: "#/components/schemas/PortTerminal"
      additionalProperties: false

    PortList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Port"

    ActiveChange:
      type: object
      required: [active]
      properties:
        active:
          type: boolean
      additionalProperties: false
